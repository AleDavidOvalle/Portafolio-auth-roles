<div class="page-container">
    <div class="card">

        <p class="subtitle">Crear cuenta</p>
        <h2>Registro</h2>

        <div class="form-group">
            <label>Email</label>
            <input [(ngModel)]="form.email" placeholder="correo@ejemplo.com">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" [(ngModel)]="form.password">
        </div>

        <div class="form-group">
            <label>Rol</label>
            <select [(ngModel)]="form.role">
                <option value="USER">User</option>
                <option value="ADMIN">Admin</option>
            </select>
        </div>

        <button class="btn btn-primary" (click)="register()">
            Crear cuenta
        </button>

        <button class="btn btn-secondary mt-10" (click)="goToLogin()">
            Volver al login
        </button>

</div>
</div>
